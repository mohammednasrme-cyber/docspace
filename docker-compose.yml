services:
  postgres:
    image: postgres:16-alpine
    container_name: docspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docspace
      POSTGRES_PASSWORD: docspace
      POSTGRES_DB: docspace
    ports:
      - "5433:5432"
    volumes:
      - docspace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docspace -d docspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  docspace_pgdata:
